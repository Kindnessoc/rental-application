<body>

<div class="container">
  <h1>Update Password</h1>

  <form id="passwordForm">
    <label>New Password</label>
    <input
      type="password"
      id="password"
      minlength="6"
      required
      placeholder="Enter new password"
    >

    <label>Confirm Password</label>
    <input
      type="password"
      id="confirmPassword"
      minlength="6"
      required
      placeholder="Confirm new password"
    >

    <button type="submit" id="updateButton">
      Update Password
    </button>

    <div id="message"></div>
  </form>

  <a href="admin.html">Return to Admin Login</a>
</div>

<script>
  const SUPABASE_URL = "https://nwohrchlobeuamkbeddn.supabase.co";

  // Use the same publishable/anon key that is already in your admin.html.
  const SUPABASE_KEY = "sb_publishable_CnNpbSInnNuwkog-UiW6lg_rFXTr6Tk";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("passwordForm");
  const message = document.getElementById("message");
  const button = document.getElementById("updateButton");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      message.textContent = "Passwords do not match.";
      return;
    }

    button.disabled = true;
    message.textContent = "Updating password...";

    const { error } = await supabaseClient.auth.updateUser({
      password: password
    });

    if (error) {
      message.textContent = error.message;
      button.disabled = false;
      return;
    }

    message.textContent =
      "Password updated successfully. You can now log in.";

    form.reset();

    setTimeout(() => {
      window.location.href = "admin.html";
    }, 2000);
  });
</script>

</body>
</html>
