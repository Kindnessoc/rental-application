<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Home Realty - Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    h2 {
      text-align: center;
    }

    input,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 7px 0 15px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 17px;
    }

    button.forgot {
      background: #6b7280;
    }

    button.upload {
      background: #2563eb;
    }

    button.logout {
      background: #dc2626;
    }

    .message {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
    }

    .image-preview {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 5px;
      display: none;
    }

    .selected-file {
      font-size: 14px;
      color: #555;
      margin-bottom: 15px;
    }

    #dashboard {
      display: none;
    }

    #fileInput {
      display: none;
    }

    .file-label {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 7px 0 15px;
      background: #2563eb;
      color: white;
      text-align: center;
      border-radius: 7px;
      cursor: pointer;
      font-size: 17px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Next Home Realty</h1>

  <!-- LOGIN -->
  <div id="login">

    <h2>Private Dashboard Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="login()">Log In</button>

    <button class="forgot" onclick="resetPassword()">
      Forgot Password?
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- ADMIN DASHBOARD -->
  <div id="dashboard">

    <h2>Add New Property</h2>

    <input
      id="title"
      placeholder="Property title"
    >

    <input
      id="price"
      placeholder="Price"
    >

    <input
      id="location"
      placeholder="Location"
    >

    <input
      id="bedrooms"
      placeholder="Bedrooms"
      type="number"
    >

    <input
      id="bathrooms"
      placeholder="Bathrooms"
      type="number"
    >

    <textarea
      id="description"
      placeholder="Property description"
    ></textarea>


    <!-- PHOTO UPLOAD -->
    <label class="file-label" for="fileInput">
      📷 Choose Property Photo
    </label>

    <input
      type="file"
      id="fileInput"
      accept="image/*"
      onchange="showSelectedImage(event)"
    >

    <div id="selectedFile" class="selected-file">
      No photo selected
    </div>

    <img
      id="imagePreview"
      class="image-preview"
      alt="Property photo preview"
    >


    <input
      id="contact_phone"
      placeholder="Contact phone number"
      value="223-227-3065"
    >

    <button
      class="upload"
      onclick="addProperty()"
    >
      Add Property
    </button>

    <button
      class="logout"
      onclick="logout()"
    >
      Log Out
    </button>

    <div id="message" class="message"></div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://nwohrchlobeuamkbeddn.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CnNpbSInnNuwkog-UiW6lg_rFXTr6Tk";


  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  // LOGIN
  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");


    if (!email || !password) {

      message.textContent =
        "Please enter your email and password.";

      return;
    }


    message.textContent = "Logging in...";


    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      message.textContent =
        error.message;

      return;
    }


    document.getElementById("login").style.display =
      "none";

    document.getElementById("dashboard").style.display =
      "block";

    message.textContent = "";
  }


  // PASSWORD RESET
  async function resetPassword() {

    const email =
      document.getElementById("email").value.trim();

    const message =
      document.getElementById("loginMessage");


    if (!email) {

      message.textContent =
        "Please enter your email address first.";

      return;
    }


    message.textContent =
      "Sending password reset email...";


    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            "https://kindnessoc.github.io/rental-application/update-password.html"
        }
      );


    if (error) {

      message.textContent =
        error.message;

      return;
    }


    message.textContent =
      "Password reset email sent. Please check your email.";
  }


  // SHOW SELECTED PHOTO
  function showSelectedImage(event) {

    const file =
      event.target.files[0];

    const preview =
      document.getElementById("imagePreview");

    const selectedFile =
      document.getElementById("selectedFile");


    if (!file) {

      preview.style.display = "none";

      selectedFile.textContent =
        "No photo selected";

      return;
    }


    selectedFile.textContent =
      "Selected: " + file.name;


    const reader =
      new FileReader();


    reader.onload = function(e) {

      preview.src = e.target.result;

      preview.style.display = "block";
    };


    reader.readAsDataURL(file);
  }


  // ADD PROPERTY
  async function addProperty() {

    const message =
      document.getElementById("message");


    const {
      data: { user }
    } = await supabaseClient.auth.getUser();


    if (!user) {

      message.textContent =
        "Please log in first.";

      return;
    }


    const file =
      document.getElementById("fileInput").files[0];


    if (!file) {

      message.textContent =
        "Please choose a property photo.";

      return;
    }


    const title =
      document.getElementById("title").value.trim();

    const price =
      document.getElementById("price").value.trim();

    const location =
      document.getElementById("location").value.trim();

    const bedrooms =
      document.getElementById("bedrooms").value.trim();

    const bathrooms =
      document.getElementById("bathrooms").value.trim();

    const description =
      document.getElementById("description").value.trim();

    const contact_phone =
      document.getElementById("contact_phone").value.trim();


    if (!title || !price || !location) {

      message.textContent =
        "Please enter the property title, price, and location.";

      return;
    }


    message.textContent =
      "Uploading property photo...";


    // Create a unique filename
    const fileExtension =
      file.name.split(".").pop();

    const fileName =
      Date.now() +
      "-" +
      Math.random().toString(36).substring(2) +
      "." +
      fileExtension;


    const filePath =
      "properties/" + fileName;


    // Upload photo to Supabase Storage
    const { error: uploadError } =
      await supabaseClient.storage
        .from("property-images")
        .upload(filePath, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });


    if (uploadError) {

      message.textContent =
        "Photo upload failed: " +
        uploadError.message;

      return;
    }


    // Get public photo URL
    const { data: publicUrlData } =
      supabaseClient.storage
        .from("property-images")
        .getPublicUrl(filePath);


    const imageUrl =
      publicUrlData.publicUrl;


    message.textContent =
      "Saving property...";


    // Save property information
    const property = {

      title: title,

      price: price,

      location: location,

      bedrooms: bedrooms,

      bathrooms: bathrooms,

      description: description,

      image_url: imageUrl,

      contact_phone:
        contact_phone || "223-227-3065",

      status: "Available"
    };


    const { error: propertyError } =
      await supabaseClient
        .from("properties")
        .insert([property]);


    if (propertyError) {

      message.textContent =
        "Property could not be saved: " +
        propertyError.message;

      return;
    }


    message.textContent =
      "✅ Property and photo added successfully!";


    // Clear form
    document.getElementById("title").value = "";
    document.getElementById("price").value = "";
    document.getElementById("location").value = "";
    document.getElementById("bedrooms").value = "";
    document.getElementById("bathrooms").value = "";
    document.getElementById("description").value = "";

    document.getElementById("fileInput").value = "";

    document.getElementById("selectedFile").textContent =
      "No photo selected";

    document.getElementById("imagePreview").style.display =
      "none";

  }


  // LOG OUT
  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("dashboard").style.display =
      "none";

    document.getElementById("login").style.display =
      "block";

  }

</script>

</body>
</html>
