<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nextep Realty - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
    }

    .login-btn {
      background: #111827;
      color: white;
    }

    .save-btn {
      background: #16a34a;
      color: white;
    }

    .logout-btn {
      background: #dc2626;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
      line-height: 1.4;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    #adminArea {
      display: none;
    }

    #loginArea {
      display: block;
    }

    .image-box {
      border: 2px dashed #9ca3af;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      background: #f9fafb;
    }

    .image-box p {
      margin: 5px 0 12px;
      color: #6b7280;
    }

    #imageInput {
      border: none;
      padding: 5px;
      background: transparent;
    }

    #preview {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .preview-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #e5e7eb;
      aspect-ratio: 1 / 1;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview-number {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 12px;
    }

    .remove-image {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #dc2626;
      color: white;
      width: 30px;
      height: 30px;
      padding: 0;
      margin: 0;
      border-radius: 50%;
      font-size: 18px;
      line-height: 30px;
    }

    .upload-status {
      margin-top: 12px;
      font-weight: bold;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .small-note {
      color: #6b7280;
      font-size: 13px;
      margin-top: 6px;
    }

    @media (max-width: 500px) {
      #preview {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Nextep Realty</h1>
  <p>Property Admin Dashboard</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginArea" class="card">
    <h2>Admin Login</h2>

    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter admin email"
      autocomplete="email"
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter password"
      autocomplete="current-password"
    >

    <button class="login-btn" id="loginButton" onclick="login()">
      Login
    </button>

    <button
      type="button"
      style="background:#e5e7eb;color:#111827;"
      onclick="resetPassword()"
    >
      Forgot Password
    </button>

    <div id="loginMessage" class="message"></div>
  </div>


  <!-- ADMIN AREA -->
  <div id="adminArea">

    <div class="card">
      <h2>Add New Property</h2>

      <label for="title">Property Title</label>
      <input
        type="text"
        id="title"
        placeholder="Example: 1 Bedroom Apartment"
      >

      <label for="address">Address</label>
      <input
        type="text"
        id="address"
        placeholder="Example: 1201 W Girard Avenue, Philadelphia, PA 19123"
      >

      <label for="price">Price</label>
      <input
        type="text"
        id="price"
        placeholder="Example: $850"
      >

      <label for="bedrooms">Bedrooms</label>
      <input
        type="number"
        id="bedrooms"
        placeholder="1"
        min="0"
      >

      <label for="bathrooms">Bathrooms</label>
      <input
        type="number"
        id="bathrooms"
        placeholder="1"
        min="0"
      >

      <label for="description">Description</label>
      <textarea
        id="description"
        placeholder="Enter property description..."
      ></textarea>

      <label>Property Pictures</label>

      <div class="image-box">
        <p>
          Select multiple pictures from your phone gallery.
        </p>

        <input
          type="file"
          id="imageInput"
          accept="image/*"
          multiple
        >

        <div class="small-note">
          You can select several pictures at the same time.
        </div>
      </div>

      <div id="preview"></div>

      <div id="uploadStatus" class="upload-status"></div>

      <button
        class="save-btn"
        id="saveButton"
        onclick="saveProperty()"
      >
        Upload Property
      </button>

      <div id="propertyMessage" class="message"></div>

      <button
        class="logout-btn"
        onclick="logout()"
      >
        Logout
      </button>
    </div>

  </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /*
   ============================================================
   PUT YOUR SUPABASE INFORMATION HERE
   ============================================================
  */

  const SUPABASE_URL = "PASTE YOUR SUPABASE PROJECT URL HERE";

  const SUPABASE_KEY = "PASTE YOUR SUPABASE PUBLISHABLE KEY HERE";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /*
   ============================================================
   VARIABLES
   ============================================================
  */

  let selectedFiles = [];


  /*
   ============================================================
   CHECK LOGIN
   ============================================================
  */

  async function checkLogin() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {
      showAdmin();
    } else {
      showLogin();
    }
  }


  /*
   ============================================================
   LOGIN
   ============================================================
  */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const button =
      document.getElementById("loginButton");

    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Please enter your email and password.",
        "error"
      );

      return;
    }

    button.disabled = true;
    button.textContent = "Logging in...";

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    button.disabled = false;
    button.textContent = "Login";

    if (error) {

      showMessage(
        "loginMessage",
        error.message,
        "error"
      );

      return;
    }

    showAdmin();

  }


  /*
   ============================================================
   FORGOT PASSWORD
   ============================================================
  */

  async function resetPassword() {

    const email =
      document.getElementById("email").value.trim();

    if (!email) {

      showMessage(
        "loginMessage",
        "Enter your email address first, then tap Forgot Password.",
        "error"
      );

      return;
    }

    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin +
            window.location.pathname
        }
      );

    if (error) {

      showMessage(
        "loginMessage",
        error.message,
        "error"
      );

      return;
    }

    showMessage(
      "loginMessage",
      "Password reset instructions have been sent to your email.",
      "success"
    );

  }


  /*
   ============================================================
   SHOW ADMIN
   ============================================================
  */

  function showAdmin() {

    document.getElementById("loginArea").style.display =
      "none";

    document.getElementById("adminArea").style.display =
      "block";
  }


  /*
   ============================================================
   SHOW LOGIN
   ============================================================
  */

  function showLogin() {

    document.getElementById("loginArea").style.display =
      "block";

    document.getElementById("adminArea").style.display =
      "none";
  }


  /*
   ============================================================
   LOGOUT
   ============================================================
  */

  async function logout() {

    await supabaseClient.auth.signOut();

    showLogin();

  }


  /*
   ============================================================
   MULTIPLE IMAGE SELECTION
   ============================================================
  */

  document
    .getElementById("imageInput")
    .addEventListener("change", function(event) {

      const newFiles =
        Array.from(event.target.files);

      /*
       Add the newly selected pictures
       to the existing selection.
      */

      selectedFiles =
        selectedFiles.concat(newFiles);

      /*
       Remove duplicate files.
      */

      const uniqueFiles = [];

      const seen = new Set();

      selectedFiles.forEach(file => {

        const key =
          file.name +
          "_" +
          file.size +
          "_" +
          file.lastModified;

        if (!seen.has(key)) {

          seen.add(key);
          uniqueFiles.push(file);

        }

      });

      selectedFiles = uniqueFiles;

      displayPreviews();

      /*
       Clear input so the user can select
       another group of pictures later.
      */

      event.target.value = "";

    });


  /*
   ============================================================
   DISPLAY IMAGE PREVIEWS
   ============================================================
  */

  function displayPreviews() {

    const preview =
      document.getElementById("preview");

    preview.innerHTML = "";

    selectedFiles.forEach((file, index) => {

      const reader =
        new FileReader();

      reader.onload = function(e) {

        const item =
          document.createElement("div");

        item.className =
          "preview-item";

        item.innerHTML = `
          <img src="${e.target.result}" alt="Property picture">
          <div class="preview-number">
            Picture ${index + 1}
          </div>
          <button
            type="button"
            class="remove-image"
            onclick="removeImage(${index})"
          >
            ×
          </button>
        `;

        preview.appendChild(item);

      };

      reader.readAsDataURL(file);

    });

  }


  /*
   ============================================================
   REMOVE SELECTED IMAGE
   ============================================================
  */

  function removeImage(index) {

    selectedFiles.splice(index, 1);

    displayPreviews();

  }


  /*
   ============================================================
   SAVE PROPERTY
   ============================================================
  */

  async function saveProperty() {

    const title =
      document.getElementById("title").value.trim();

    const address =
      document.getElementById("address").value.trim();

    const price =
      document.getElementById("price").value.trim();

    const bedrooms =
      document.getElementById("bedrooms").value;

    const bathrooms =
      document.getElementById("bathrooms").value;

    const description =
      document.getElementById("description").value.trim();

    const saveButton =
      document.getElementById("saveButton");

    const status =
      document.getElementById("uploadStatus");


    /*
     VALIDATION
    */

    if (!title ||
        !address ||
        !price ||
        !description) {

      showMessage(
        "propertyMessage",
        "Please fill in the property title, address, price and description.",
        "error"
      );

      return;
    }


    if (selectedFiles.length === 0) {

      showMessage(
        "propertyMessage",
        "Please select at least one property picture.",
        "error"
      );

      return;
    }


    saveButton.disabled = true;

    status.textContent =
      "Uploading pictures...";


    try {

      /*
       ========================================================
       GET CURRENT USER
       ========================================================
      */

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();


      if (!user) {

        throw new Error(
          "Your admin session has expired. Please log in again."
        );

      }


      /*
       ========================================================
       UPLOAD ALL PICTURES
       ========================================================
      */

      const imageUrls = [];


      for (
        let i = 0;
        i < selectedFiles.length;
        i++
      ) {

        const file =
          selectedFiles[i];

        status.textContent =
          "Uploading picture " +
          (i + 1) +
          " of " +
          selectedFiles.length +
          "...";


        /*
         Create a unique file name.
        */

        const extension =
          file.name.includes(".")
            ? file.name.split(".").pop()
            : "jpg";

        const fileName =
          Date.now() +
          "-" +
          crypto.randomUUID() +
          "." +
          extension;


        const filePath =
          "properties/" +
          fileName;


        /*
         Upload to Supabase Storage.
        */

        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("property-images")
            .upload(
              filePath,
              file,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (uploadError) {

          throw uploadError;

        }


        /*
         Get public URL.
        */

        const {
          data: publicUrlData
        } =
          supabaseClient
            .storage
            .from("property-images")
            .getPublicUrl(filePath);


        if (
          !publicUrlData ||
          !publicUrlData.publicUrl
        ) {

          throw new Error(
            "Could not create image URL."
          );

        }


        imageUrls.push(
          publicUrlData.publicUrl
        );

      }


      /*
       ========================================================
       SAVE PROPERTY IN DATABASE
       ========================================================
      */

      status.textContent =
        "Saving property...";


      const {
        error: databaseError
      } =
        await supabaseClient
          .from("properties")
          .insert([
            {
              title: title,
              address: address,
              price: price,
              bedrooms: bedrooms
                ? Number(bedrooms)
                : null,
              bathrooms: bathrooms
                ? Number(bathrooms)
                : null,
              description: description,

              /*
               Store all image URLs.
              */

              image_urls: imageUrls
            }
          ]);


      if (databaseError) {

        throw databaseError;

      }


      /*
       ========================================================
       SUCCESS
       ========================================================
      */

      status.textContent = "";

      showMessage(
        "propertyMessage",
        "Property uploaded successfully with " +
        imageUrls.length +
        " picture(s)!",
        "success"
      );


      /*
       Clear form.
      */

      document.getElementById("title").value = "";
      document.getElementById("address").value = "";
      document.getElementById("price").value = "";
      document.getElementById("bedrooms").value = "";
      document.getElementById("bathrooms").value = "";
      document.getElementById("description").value = "";

      selectedFiles = [];

      document.getElementById("preview").innerHTML = "";


    } catch (error) {

      console.error(error);

      status.textContent = "";

      showMessage(
        "propertyMessage",
        "Error: " +
        (error.message || "Something went wrong."),
        "error"
      );

    }


    saveButton.disabled = false;

  }


  /*
   ============================================================
   MESSAGE
   ============================================================
  */

  function showMessage(
    elementId,
    message,
    type
  ) {

    const element =
      document.getElementById(elementId);

    element.textContent = message;

    element.className =
      "message " + type;

    element.style.display =
      "block";

  }


  /*
   ============================================================
   START
   ============================================================
  */

  checkLogin();

</script>

</body>
</html>
