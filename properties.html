<!DOCTYPE html>
<html>
<head>
  <title>Nextep Realty - Properties</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .property {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 10px;
    }

    .images img {
      width: 100%;
      max-width: 350px;
      height: 230px;
      object-fit: cover;
      border-radius: 8px;
      margin: 5px;
    }

    button {
      background: #111;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
<h1>Nextep Realty</h1>
<p>Find your next home</p>
</header>

<div id="properties">
Loading properties...
</div>


<script>

const SUPABASE_URL = "https://nwohrchlobeuamkbeddn.supabase.co";

const SUPABASE_KEY = "sb_publishable_CnNpbSInnNuwkog-UiW6lg_rFXTr6Tk";

const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


async function loadProperties(){

const {data,error} = await supabaseClient
.from("properties")
.select("*")
.eq("status","available")
.order("created_at",{ascending:false});


if(error){
document.getElementById("properties").innerHTML =
"Error loading properties";
console.log(error);
return;
}


let html="";


data.forEach(property=>{


let images="";

if(property.image_urls){

let list = property.image_urls;

if(typeof list === "string"){
list = JSON.parse(list);
}


list.forEach(img=>{
images += `
<img src="${img}">
`;
});

}


html += `

<div class="property">

<h2>${property.title}</h2>

<div class="images">
${images}
</div>

<h3>$${property.price}</h3>

<p>${property.description}</p>

<p>
Location: ${property.location}
</p>

<p>
Bedrooms: ${property.bedrooms}
<br>
Bathrooms: ${property.bathrooms}
</p>


<a href="tel:${property.contact_phone}">
<button>Call</button>
</a>

<a href="sms:${property.contact_phone}">
<button>Text</button>
</a>


</div>

`;

});


document.getElementById("properties").innerHTML = html;


}


loadProperties();

</script>

</body>
</html>
